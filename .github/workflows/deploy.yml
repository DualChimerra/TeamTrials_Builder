name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # npm install (not ci): Tailwind's oxide pulls platform-specific optional
      # native deps whose tree differs from the lockfile's generation platform,
      # which trips npm ci's strict sync check.
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          # Project site is served from /<repo>/ — keep in sync with the repo name.
          VITE_BASE: /TeamTrials_Builder/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
